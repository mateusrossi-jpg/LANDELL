name: Build Windows & Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'studio/**'
      - '.github/workflows/build_windows.yml'

jobs:
  build_windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./studio
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Baixar dependências
        run: flutter pub get

      - name: Build do Windows Release
        run: flutter build windows --release

      - name: Compilar Instalador Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer\landell_installer.iss

      - name: Disponibilizar Instalador (Setup .exe)
        uses: actions/upload-artifact@v4
        with:
          name: LANDELL-Studio-Windows-Installer
          path: studio/windows/installer/Output/LANDELL_Studio_Setup_x64.exe

      - name: Disponibilizar Versão Portável (Pasta Release)
        uses: actions/upload-artifact@v4
        with:
          name: LANDELL-Studio-Windows-Portable
          path: studio/build/windows/x64/runner/Release/
