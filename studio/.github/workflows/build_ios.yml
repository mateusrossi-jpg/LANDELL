name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Baixar dependências
        run: flutter pub get

      - name: Build do iOS sem assinatura
        run: flutter build ios --release --no-codesign

      - name: Empacotar para IPA
        run: |
          mkdir Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r Payload.ipa Payload

      - name: Disponibilizar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Studio-IPA
          path: Payload.ipa
