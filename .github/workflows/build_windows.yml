name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build_windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./studio
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Baixar dependências
        run: flutter pub get

      - name: Build do Windows sem assinatura
        run: flutter build windows

      - name: Disponibilizar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Studio-Windows
          path: studio/build/windows/x64/runner/Release/endap_studio.exe
